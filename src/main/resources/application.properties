# 💡 Spring Boot 설정: 이 파일은 애플리케이션의 핵심 설정을 담습니다.

# spring.config.import는 다른 설정 파일(예: .env)을 가져올 때 사용하며, 반드시 파일의 맨 위에 위치해야 합니다.
# optional:file:.env는 프로젝트 루트 디렉토리에 있는 .env 파일을 불러오며, 파일이 없어도 오류를 발생시키지 않습니다.
# ✅ 현재 문제 진단을 위해 .env 파일을 통해 로드하는 대신, 직접 비밀번호를 명시합니다.
# 🚨🚨🚨 중요한 보안 경고: 개발/디버깅 목적으로만 사용하고, 프로덕션 환경에서는 반드시 이 값을 .env 파일이나 다른 안전한 방법으로 분리해야 합니다.! 🚨🚨🚨
# 현재 .env 파일을 사용하지 않으므로, spring.config.import는 주석 처리합니다.
# spring.config.import=optional:file:.env

# 애플리케이션 이름 (백엔드 서비스 식별용)
spring.application.name=backend

# MySQL 데이터베이스 연결 정보 (AWS RDS 연결 설정)
# jdbc:mysql:// 뒤에는 AWS RDS 인스턴스의 엔드포인트 주소를 입력합니다.
# useSSL=false: SSL 사용 여부 (테스트/개발 환경에서는 false로 설정할 수 있으나, 프로덕션에서는 true 권장)
# allowPublicKeyRetrieval=true: MySQL 8.0 이상에서 인증 방식 호환성을 위해 필요할 수 있습니다.
# serverTimezone=Asia/Seoul: 서버 시간대를 서울로 설정하여 시간 관련 오류를 방지합니다.
spring.datasource.url=jdbc:mysql://database-1.c580mikw8lqh.ap-northeast-2.rds.amazonaws.com:3306/aws_rds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
# 데이터베이스 접속 사용자 이름
spring.datasource.username=hongik1
# 🚨🚨🚨 임시 조치: 비밀번호를 직접 명시합니다. 보안상 매우 위험하므로 문제 해결 후 반드시 .env 방식으로 전환하세요! 🚨🚨🚨
spring.datasource.password=hongik1234

# JPA (Java Persistence API) 설정: Spring Data JPA를 사용하여 데이터베이스 객체 매핑을 관리합니다.
# spring.jpa.hibernate.ddl-auto: 애플리케이션 시작 시 데이터베이스 스키마(테이블)를 자동으로 생성/업데이트/검증할지 설정합니다.
# - update: 엔티티 변경사항을 데이터베이스에 반영합니다. (개발 시 편리, 운영 환경에서는 'none' 또는 'validate' 권장)
# - none: 아무 작업도 하지 않습니다. (스키마를 수동으로 관리할 때 사용)
# - validate: 엔티티와 DB 스키마가 일치하는지 검증하고, 다르면 오류를 발생시킵니다.
# - create-drop: 애플리케이션 시작 시 스키마를 생성하고, 종료 시 삭제합니다. (테스트에 용이)
spring.jpa.hibernate.ddl-auto=update
# JPA가 생성하는 SQL 쿼리를 콘솔에 표시할지 여부
spring.jpa.show-sql=true
# 콘솔에 표시되는 SQL 쿼리를 예쁘게 포맷팅할지 여부
spring.jpa.properties.hibernate.format_sql=true
# 사용하는 데이터베이스 방언 (MySQL 8 버전에 맞춤)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# JWT (JSON Web Token) 설정: 사용자 인증 토큰 관리
# jwt.secret: JWT 토큰 서명에 사용되는 비밀 키입니다. 민감 정보이므로 .env 파일에서 로드됩니다.
# ✅ 현재 문제 진단을 위해 .env 파일을 통해 로드하는 대신, 직접 명시합니다.
# 💡💡💡 'jwt.secret=' 이 중복된 부분을 삭제하고, 실제 키 문자열만 남겨야 합니다! 💡💡💡
jwt.secret=YourVeryLongAndComplexSecretKeyThatIsAtLeast64CharactersLongForHS512Algorithm1234567890
# jwt.expiration: JWT 토큰의 유효 기간을 밀리초(ms) 단위로 설정합니다. (여기서는 3600000ms = 1시간) 지금은 7일
jwt.expiration=604800000

